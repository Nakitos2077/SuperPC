<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Meet Assistant</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8eaed; }
  .panel { height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
    background: rgba(32,33,36,.95); border: 1px solid #5f6368; border-radius: 12px; overflow: hidden; }
  .header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; -webkit-app-region: drag;
    user-select: none; background: rgba(255,255,255,.04); }
  .header button, .header input { -webkit-app-region: no-drag; }
  .title { font-weight: 600; color: #f6a26b; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ea4335; }
  .dot.on { background: #34a853; }
  .status { color: #9aa0a6; font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; background: transparent; border: none; color: #9aa0a6; cursor: pointer; padding: 0 4px; }
  button:hover { color: #fff; }
  input[type=range] { width: 70px; }
  .cards { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #2b2c2f; border: 1px solid #3c4043; border-radius: 10px; padding: 8px 10px; }
  .card:first-child { border-color: #8ab4f8; }
  .card-head { display: flex; gap: 6px; margin-bottom: 4px; }
  .card-title { flex: 1; color: #9aa0a6; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content { font-size: 14px; }
  .content p { margin: 0 0 6px; }
  .content ul { margin: 0 0 6px; padding-left: 18px; }
  .content .h { font-weight: 600; margin: 4px 0; color: #fff; }
  .content b { color: #fff; }
  .content code { background: #202124; padding: 0 4px; border-radius: 4px; }
  .typing, .muted, .empty { color: #9aa0a6; font-style: italic; }
  .error { color: #f28b82; }
  .footer { padding: 4px 10px 6px; color: #80868b; font-size: 11px; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="title">✳ Claude</span>
    <span id="dot" class="dot"></span>
    <span id="status" class="status">Ждёт Chrome…</span>
    <span class="spacer"></span>
    <input id="opacity" type="range" min="30" max="100" value="100" title="Прозрачность">
    <button id="clear" title="Очистить">🗑</button>
    <button id="min" title="Свернуть">▁</button>
    <button id="quit" title="Закрыть">✕</button>
  </div>
  <div id="cards" class="cards">
    <div class="empty">Подсказки появятся здесь автоматически. Этого окна не видно при демонстрации экрана.</div>
  </div>
  <div class="footer">Ctrl+Shift+H — спрятать/показать</div>
</div>
<script src="renderer.js"></script>
</body>
</html>
